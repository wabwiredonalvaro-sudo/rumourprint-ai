plugins {
    id 'com.android.application'
}

android {
    namespace 'africa.freshexclusive.rumourprint'
    compileSdk 35

    defaultConfig {
        applicationId 'africa.freshexclusive.rumourprint'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0-beta'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
