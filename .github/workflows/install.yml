name: Install RUMOURPRINT AI application
on:
  push:
    paths:
      - '.deploy/payload*.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack verified application source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, tarfile, sys
          files = sorted(Path('.deploy').glob('payload*.txt'))
          if len(files) != 8:
              print(f'Waiting for all eight parts; found {len(files)}.')
              sys.exit(0)
          raw = base64.b64decode(''.join(p.read_text().strip() for p in files), validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = Path(member.name)
                  if target.is_absolute() or '..' in target.parts or not member.isfile():
                      raise ValueError('Unexpected archive entry: ' + member.name)
              archive.extractall('.', filter='data')
          print('Application source restored.')
          PY
          if test -f app.py; then
            rm -rf .deploy
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Deploy RUMOURPRINT AI professional application" || exit 0
            git push
          fi
