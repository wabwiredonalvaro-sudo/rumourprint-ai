name: Verify RUMOURPRINT AI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Validate Python source compilation
        run: python -m py_compile app.py source_verification.py social_verification.py image_provenance.py image_source_search.py image_source_ui.py evidence.py engine.py network.py
      - name: Run offline regression suite
        run: python -m pytest -q tests/
